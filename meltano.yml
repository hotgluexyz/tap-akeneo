send_anonymous_usage_stats: false
project_id: tap-akeneo
default_environment: test
requires_meltano: ">=4.0"
environments:
  - name: test
plugins:
  extractors:
    - name: tap-akeneo
      namespace: tap_akeneo
      pip_url: -e .
      capabilities: [state, catalog, discover, about, stream-maps]
      settings:
        - name: base_url
          label: Akeneo PIM URL
        - name: access_token
          label: App OAuth Access Token
          sensitive: true
        - name: start_date
          kind: date_iso8601
        - name: full_table
          kind: boolean
          value: true
        - name: page_size
          kind: integer
          value: 100
        - name: include_enterprise
          kind: boolean
          value: false
      settings_group_validation:
        - [base_url, access_token]
      select:
        - '*.*'
